name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Tests without Faker (seed-file paths must not need it)
        run: python -m unittest discover -s tests -v
      - name: Tests with Faker
        run: uv run --no-project --with faker==40.40.0 python -m unittest discover -s tests -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate the Claude Code plugin and marketplace
        run: |
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate .claude-plugin/marketplace.json
