name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --prefix=rpg-name-generator/ -o rpg-name-generator.skill HEAD SKILL.md LICENSE scripts
      - run: gh release upload "${{ github.event.release.tag_name }}" rpg-name-generator.skill
        env:
          GH_TOKEN: ${{ github.token }}
