name: Release

# Releases are immutable, so the release is created with its assets in one step.
# To release: git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          git archive --format=zip --prefix=rpg-name-generator/ -o rpg-name-generator.skill HEAD:skills/rpg-name-generator
          sha256sum rpg-name-generator.skill > rpg-name-generator.skill.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rpg-name-generator.skill
      - run: gh release create "$TAG" rpg-name-generator.skill rpg-name-generator.skill.sha256 --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
